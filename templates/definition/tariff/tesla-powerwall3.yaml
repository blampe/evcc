template: tesla-powerwall3
products:
  - brand: Tesla
    description:
      generic: Powerwall 3
group: price
requirements:
  evcc: ["skiptest"]
params:
  - name: clientId
    description:
      generic: Client ID
    help:
      en: from [Tesla Developer Dashboard](https://developer.tesla.com/dashboard).
      de: von [Tesla Developer Dashboard](https://developer.tesla.com/dashboard).
    required: true
  - name: accessToken
    help:
      en: from [myteslamate.com](https://app.myteslamate.com/).
      de: von [myteslamate.com](https://app.myteslamate.com/).
    required: true
    mask: true
  - name: refreshToken
    help:
      en: from [myteslamate.com](https://app.myteslamate.com/).
      de: von [myteslamate.com](https://app.myteslamate.com/).
    required: true
    mask: true
  - name: tariffDirection
    type: choice
    choice: ["import", "export"]
    required: true
    description:
      generic: Tariff Direction
    help:
      en: Whether this tariff is for import (grid buy) or export (feed-in sell).
      de: Ob dieser Tarif für Import (Netzbezug) oder Export (Einspeisung) ist.
  - name: siteid
    description:
      generic: Site ID
    help:
      en: optional energy site identifier, leave empty for auto-detection
      de: optionale Energy Site ID, leer lassen für automatische Erkennung
  - name: ownerapitoken
    description:
      generic: Owner API Token (VPP)
    help:
      en: optional legacy owner-api refresh token. On an export tariff it enables automatic Tesla VPP (grid-services) event detection, reflecting the event export payout in this tariff so the optimizer plans around it.
      de: optionaler Owner-API Refresh-Token. Bei einem Einspeisetarif aktiviert er die automatische Erkennung von Tesla VPP-Ereignissen (Netzdienste) und berücksichtigt die Einspeisevergütung des Ereignisses in diesem Tarif.
    mask: true
  - name: vpppremium
    description:
      generic: VPP Premium
    help:
      en: export payout per kWh applied to slots during a VPP event (default 2.0)
      de: Einspeisevergütung pro kWh während eines VPP-Ereignisses (Standard 2.0)
render: |
  type: teslafleetapi
  tariffDirection: {{ .tariffDirection }}
  credentials:
    id: {{ .clientId }}
  tokens:
    access: {{ .accessToken }}
    refresh: {{ .refreshToken }}
  {{ if .siteid }}siteid: {{ .siteid }}{{ end }}
  {{ if .ownerapitoken }}ownerapitoken: {{ .ownerapitoken }}{{ end }}
  {{ if .vpppremium }}vpppremium: {{ .vpppremium }}{{ end }}
